<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="贪吃蛇链路验证版">
  <title>贪吃蛇 · 验证版</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #101827;
  color: #e6edf3;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 24px 16px;
}

.app { width: 100%; max-width: 1000px; }

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 20px;
}

.eyebrow { font-size: 12px; letter-spacing: 0.2em; color: #7d8a9e; }

.release-tag {
  display: inline-block;
  margin: 8px 0;
  padding: 2px 10px;
  font-size: 12px;
  background: rgba(80, 200, 140, 0.15);
  color: #56d6a0;
  border-radius: 999px;
}

h1 { font-size: 28px; }

.restart-button {
  padding: 10px 18px;
  background: transparent;
  color: #e6edf3;
  border: 1px solid #3a4a63;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}
.restart-button:hover { background: #1c2740; }

.game-panel {
  background: #0b1220;
  border: 1px solid #1f2c44;
  border-radius: 12px;
  padding: 16px;
}

.hud {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
  font-size: 14px;
  color: #9aa7bd;
}
.hud strong { color: #fff; margin-left: 6px; }

canvas {
  width: 100%;
  height: auto;
  display: block;
  background: #070d18;
  border-radius: 8px;
}

footer { margin-top: 16px; font-size: 13px; color: #7d8a9e; }
footer p { margin: 4px 0; }

</style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">GAME PROTOTYPE</p>
        <span class="release-tag">链路验证版</span>
        <h1>贪吃蛇 · Snake</h1>
      </div>
      <button id="restartButton" class="restart-button" type="button">重新开始</button>
    </header>

    <section class="game-panel" aria-label="游戏区域">
      <div class="hud">
        <span>分数 <strong id="scoreValue">0</strong></span>
        <span>状态 <strong id="statusValue">准备中</strong></span>
      </div>
      <canvas id="gameCanvas" width="960" height="540" aria-label="游戏画布"></canvas>
    </section>

    <footer>
      <p>移动：WASD / 方向键</p>
      <p class="hint">用于验证 monorepo → CI → 自动发布 → 实验室卡片 全链路。</p>
    </footer>
  </main>
  <script>
(()=>{var c=document.getElementById("gameCanvas"),l=c.getContext("2d"),x=document.getElementById("scoreValue"),d=document.getElementById("statusValue"),E=document.getElementById("restartButton"),n=24,u=c.width/n,h=Math.floor(c.height/n),a,o,r,i,s,y;function m(){for(;;){let t={x:Math.floor(Math.random()*u),y:Math.floor(Math.random()*h)};if(!a.some(e=>e.x===t.x&&e.y===t.y)){i=t;return}}}function w(){a=[{x:12,y:11},{x:11,y:11},{x:10,y:11}],o={x:1,y:0},r=o,s=0,y=!0,d.textContent="\u8FDB\u884C\u4E2D",x.textContent="0",m()}function C(){o=r;let t={x:a[0].x+o.x,y:a[0].y+o.y},e=t.x<0||t.x>=u||t.y<0||t.y>=h,g=a.some(f=>f.x===t.x&&f.y===t.y);if(e||g){y=!1,d.textContent="\u6E38\u620F\u7ED3\u675F";return}a.unshift(t),t.x===i.x&&t.y===i.y?(s+=10,x.textContent=String(s),m()):a.pop()}function S(){l.fillStyle="#070d18",l.fillRect(0,0,c.width,c.height),l.fillStyle="#ff8c5a",l.beginPath(),l.arc(i.x*n+n/2,i.y*n+n/2,n/2-3,0,Math.PI*2),l.fill(),a.forEach((t,e)=>{l.fillStyle=e===0?"#56d6a0":"#3aa87e",l.fillRect(t.x*n+1,t.y*n+1,n-2,n-2)})}function k(){y&&C(),S()}document.addEventListener("keydown",t=>{let e=t.key.toLowerCase();(e==="arrowup"||e==="w")&&o.y!==1?r={x:0,y:-1}:(e==="arrowdown"||e==="s")&&o.y!==-1?r={x:0,y:1}:(e==="arrowleft"||e==="a")&&o.x!==1?r={x:-1,y:0}:(e==="arrowright"||e==="d")&&o.x!==-1&&(r={x:1,y:0})});E.addEventListener("click",()=>w());w();setInterval(k,120);})();

</script>
</body>
</html>
