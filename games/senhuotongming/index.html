<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="森火通明游戏原型">
  <title>森火通明 · 游戏原型</title>
  <style>
* { box-sizing: border-box; }
:root { color-scheme: dark; font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; background: #0b1220; color: #e5edf8; }
body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top, #1c2b43 0, #0b1220 65%); }
button { font: inherit; }
.app { width: min(1100px, 100%); margin: 0 auto; padding: 28px 22px 36px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
.eyebrow { margin: 0 0 6px; color: #83b6ff; font-size: 11px; letter-spacing: .18em; }
.release-tag { display: inline-block; margin-top: 9px; padding: 4px 9px; border: 1px solid #397b68; border-radius: 999px; color: #a8f0d2; background: #17382f; font-size: 11px; letter-spacing: .04em; }
h1 { margin: 0; font-size: clamp(21px, 4vw, 30px); }
.restart-button, .touch-controls button { border: 1px solid #47617f; border-radius: 10px; color: #eaf3ff; background: #1b2b42; cursor: pointer; }
.restart-button { padding: 10px 16px; }
.restart-button:hover, .touch-controls button:active { background: #29486c; }
.game-panel { overflow: hidden; border: 1px solid #30445f; border-radius: 16px; background: #101b2b; box-shadow: 0 18px 55px #0005; }
.hud { display: flex; justify-content: space-between; padding: 13px 17px; color: #9fb2cb; font-size: 13px; }
.hud strong { color: #f1f6ff; margin-left: 6px; }
canvas { display: block; width: 100%; height: auto; background: #101c2b; touch-action: none; }
footer { padding: 14px 3px; color: #a9bad0; font-size: 13px; }
footer p { margin: 4px 0; }
.hint { color: #71869f; }
.touch-controls { display: none; padding: 12px; justify-content: space-between; align-items: center; }
.touch-controls button { width: 54px; height: 46px; font-size: 18px; }
.horizontal-controls { display: flex; gap: 8px; }
@media (pointer: coarse), (max-width: 700px) {
  .app { padding: 16px 12px 24px; }
  .touch-controls { display: flex; }
  .topbar { align-items: flex-start; }
}

</style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">GAME PROTOTYPE</p>
        <span class="release-tag" data-testid="release-tag">自动发布验证版</span>
        <h1>森火通明 · 原型测试场</h1>
      </div>
      <button id="restartButton" class="restart-button" type="button">重新开始</button>
    </header>

    <section class="game-panel" aria-label="游戏区域">
      <div class="hud">
        <span>生存时间 <strong id="timeValue">0.0s</strong></span>
        <span>状态 <strong id="statusValue">准备中</strong></span>
      </div>
      <canvas id="gameCanvas" width="960" height="540" aria-label="游戏画布"></canvas>
      <div class="touch-controls" aria-label="触屏方向控制">
        <button data-control="up" aria-label="向上">▲</button>
        <div class="horizontal-controls">
          <button data-control="left" aria-label="向左">◀</button>
          <button data-control="down" aria-label="向下">▼</button>
          <button data-control="right" aria-label="向右">▶</button>
        </div>
      </div>
    </section>

    <footer>
      <p>移动：WASD / 方向键 / 触屏按钮</p>
      <p class="hint">当前为通用技术验证原型，具体玩法等待游戏设计确定。</p>
    </footer>
  </main>

</body>
</html>
